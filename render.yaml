# Blueprint de deploy para o Render (https://render.com)
#
# Como usar:
#   1. Suba este projeto para um repositório no GitHub/GitLab.
#   2. No painel do Render, clique em "New +" -> "Blueprint" e aponte para o repositório.
#   3. O Render vai ler este arquivo e criar automaticamente:
#        - um Web Service (Flask + Gunicorn)
#        - um banco PostgreSQL gerenciado
#        - um disco persistente para as imagens enviadas pelo painel (/uploads)
#      já conectados entre si, com SSL e domínio *.onrender.com prontos.
#   4. Depois do primeiro deploy, abra o "Shell" do serviço no painel do Render
#      e rode `flask create-admin` para criar seu usuário administrador
#      (veja RENDER_DEPLOY.md para o passo a passo completo).

databases:
  - name: bentao-db
    plan: free
    databaseName: bentao_db
    user: bentao_user

services:
  - type: web
    name: bentao-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn wsgi:app --workers 2 --timeout 60"
    autoDeploy: true
    healthCheckPath: /
    disk:
      name: bentao-uploads
      mountPath: /opt/render/project/src/app/static/uploads
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: PREFERRED_URL_SCHEME
        value: "https"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: bentao-db
          property: connectionString
